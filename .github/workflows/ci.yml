name: Validate extension
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and catalog tests
        run: npm run check
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Check GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas/
      - name: Check metadata
        run: python3 -m json.tool metadata.json >/dev/null
